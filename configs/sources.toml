# Dataset sources for Superturn.
#
# Every source names its licence and role. `bin/plan-downloads` prices each
# source exactly from the provider's file listing before anything is
# downloaded. `bin/download` downloads them on the campaign machine.
#
# kind:
#   hf       Hugging Face dataset repo; `include`/`exclude` are glob patterns
#            over repo paths; `revision` pins the commit once recorded.
#   urllist  Plain HTTPS files listed in a TSV of `size<TAB>url`.
#   http     A fixed list of HTTPS archives.
#   mdc      Mozilla Data Collective datasets, one per locale. Terms must be
#            accepted in the web UI per dataset first; the API allows 30
#            dataset downloads per organisation per day.
#
# role:
#   train-conversation  per-speaker tracks; real hold/shift labels
#   train-read          read speech; holds cut at word boundaries
#   train-spontaneous   spontaneous speech; pause holds, weak shifts
#   test                never trained on
#   noise / reverb      augmentation only
#
# `sample_*` keys select the small subset used by the on-machine smoke test.

[sources.ami]
kind = "urllist"
list = "configs/url-lists/ami-headsets.tsv"
licence = "CC BY 4.0"
attribution = "AMI Meeting Corpus, University of Edinburgh (CC BY 4.0)"
role = "train-conversation"
strip_prefix = "https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/"
sample_match = "/ES2002a/"
order = 1

[sources.icsi]
kind = "urllist"
list = "configs/url-lists/icsi-headsets.tsv"
licence = "CC BY 4.0"
attribution = "ICSI Meeting Corpus, International Computer Science Institute (CC BY 4.0)"
role = "train-conversation"
strip_prefix = "https://groups.inf.ed.ac.uk/ami/ICSIsignals/SPH/"
sample_match = "/Bmr013/"
order = 1

[sources.indic_diarbench]
kind = "hf"
repo = "sarvamai/indic-diarbench"
licence = "CC BY 4.0"
attribution = "Indic DiarBench (CC BY 4.0)"
role = "test"
include = ["*/test-*.parquet", "README.md"]
sample_include = ["Kashmiri/*", "README.md"]
order = 1

[sources.fleurs]
kind = "hf"
repo = "google/fleurs"
licence = "CC BY 4.0"
attribution = "FLEURS, Google (CC BY 4.0)"
role = "test"
include = ["data/*/test.tsv", "data/*/audio/test.tar.gz"]
sample_include = ["data/hi_in/test.tsv", "data/hi_in/audio/test.tar.gz"]
order = 2

[sources.voxpopuli]
kind = "hf"
repo = "facebook/voxpopuli"
licence = "CC0 (data only; the project's code and models are CC BY-NC and are not used)"
attribution = "VoxPopuli, Meta (CC0)"
role = "train-spontaneous"
# Two training shards per language; the combined `multilang` copy and the
# accented-English set are skipped.
include = ["*/train-00000-of-*.parquet", "*/train-00001-of-*.parquet"]
exclude = ["multilang/*", "en_accented/*"]
sample_include = ["sl/train-00000-of-*.parquet"]
order = 4

[sources.emilia_yodas]
kind = "hf"
repo = "amphion/Emilia-Dataset"
licence = "CC BY 4.0 (Emilia-YODAS subset only)"
attribution = "Emilia-YODAS, Amphion (CC BY 4.0)"
role = "train-spontaneous"
gated = "auto"
# Five ~1 GB shards per language. Only the Emilia-YODAS folder: the original
# Emilia subset is CC BY-NC and is refused.
include = ["Emilia-YODAS/*/*-B00000[0-4].tar"]
exclude = ["Emilia/*"]
sample_include = ["Emilia-YODAS/DE/DE-B000000.tar"]
order = 4

[sources.common_voice]
kind = "mdc"
licence = "CC0"
attribution = "Mozilla Common Voice (CC0)"
role = "train-read"
release = "27.0"
release_metadata = "https://raw.githubusercontent.com/common-voice/cv-dataset/main/datasets/scripted-speech/cv-corpus-27.0-2026-09-11.json"
# At most 30 per day (API limit). Chosen for languages the conversation and
# spontaneous sets cover thinly. Spanish, German and French are left out: they
# are large here (52, 37 and 31 GB) and covered by VoxPopuli and
# Emilia-YODAS. Kannada and Gujarati have no Common Voice release.
# `dataset_ids` maps locale to the MDC dataset ID once its terms are accepted
# in the web UI.
locales = [
  "hi", "bn", "ta", "te", "mr", "ml", "pa-IN", "ur", "or",
  "sw", "vi", "id", "th", "tr", "fa", "ja", "ko", "zh-CN",
  "it", "pl", "nl", "pt", "ru", "uk", "ar",
]
sample_locales = ["te"]
order = 5

[sources.common_voice.dataset_ids]
# locale = "mdc-dataset-id"

[sources.musan]
kind = "http"
licence = "CC BY 4.0"
attribution = "MUSAN, OpenSLR 17 (CC BY 4.0)"
role = "noise"
urls = ["https://www.openslr.org/resources/17/musan.tar.gz"]
sample_urls = []
order = 2

[sources.openslr26]
kind = "http"
licence = "Apache 2.0"
attribution = "Simulated room impulse responses, OpenSLR 26 (Apache 2.0)"
role = "reverb"
urls = ["https://www.openslr.org/resources/26/sim_rir_16k.zip"]
sample_urls = ["https://www.openslr.org/resources/26/sim_rir_16k.zip"]
order = 2
