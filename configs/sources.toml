# Dataset sources for Superturn.
#
# The whole selection must fit `budget_gb`. A turn model of 100k-1M parameters
# needs a few hundred thousand labelled pauses with many voices, languages and
# conditions, not hundreds of hours per language. So instead of downloading
# whole archives, every source fetches only the bytes it uses:
#
#   wav_slices       a time window from each uncompressed WAV via HTTP range
#                    requests (the same window for all tracks of one meeting)
#   hf_rowgroups     selected row groups of Hugging Face parquet files; only
#                    those column chunks are downloaded
#   hf_tar_stream    read a Hugging Face tar archive from the start and stop at
#                    `max_bytes_per_file`, keeping the members already read;
#                    `extra_files` (metadata) are fetched whole
#   http_tar_stream  the same for a plain HTTPS archive
#   hf_files         named whole files in a pinned Hugging Face repository
#   http             small whole files
#
# `bin/plan-downloads` prices each source from provider listings and file
# metadata (parquet footers, HEAD requests) and refuses a plan over budget.
# role: train-conversation | train-read | train-spontaneous | test | noise | reverb | metadata
# `sample_*` keys select the small subset used by the on-machine smoke test.

budget_gb = 20

[sources.ami]
kind = "wav_slices"
list = "configs/url-lists/ami-headsets.tsv"
strip_prefix = "https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/"
licence = "CC BY 4.0"
attribution = "AMI Meeting Corpus, University of Edinburgh (CC BY 4.0)"
role = "train-conversation"
# 4 minutes from each of 171 meetings keeps every speaker while using a
# fraction of the 46.6 GB of headset audio. The window starts 30% into the
# meeting, past introductions.
minutes_per_meeting = 4.0
start_fraction = 0.3
sample_minutes_per_meeting = 1.0
sample_match = "/ES2002a/"
order = 1

[sources.ami_annotations]
kind = "http"
licence = "CC BY 4.0"
attribution = "AMI Meeting Corpus manual annotations v1.6.2, University of Edinburgh (CC BY 4.0)"
role = "metadata"
urls = ["https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip"]
order = 1

[sources.livekit_eot_diagnostic]
kind = "hf_files"
repo = "livekit/eot-bench-data"
revision = "ae834af9e9bddf73d1f550c190aaeb99bf31f523"
licence = "CC BY 4.0"
attribution = "LiveKit End-of-Turn Benchmark data, LiveKit (CC BY 4.0)"
role = "test"
# General English task-oriented turns, evaluated separately from the frozen suite.
files = ["data/en/validation-00000-of-00002.parquet"]
max_total_bytes = 109936364
opt_in = true
order = 3

[sources.harper-valley]
kind = "http"
licence = "CC BY 4.0"
attribution = "HarperValleyBank, Wu, Nafziger, Scodary and Maas (CC BY 4.0)"
role = "train-conversation"
opt_in = true
selection_command = "python -m superturn.harper_valley_acquire"
order = 3

[sources.indic_diarbench]
kind = "hf_rowgroups"
repo = "sarvamai/indic-diarbench"
licence = "CC BY 4.0"
attribution = "Indic DiarBench (CC BY 4.0)"
role = "test"
files = ["*/test-*.parquet"]
# Row groups are taken in order until the cap; at least one per file.
max_bytes_per_file = 160_000_000
sample_files = ["Kashmiri/test-*.parquet"]
order = 1

[sources.fleurs]
kind = "hf_tar_stream"
repo = "google/fleurs"
licence = "CC BY 4.0"
attribution = "FLEURS, Google (CC BY 4.0)"
role = "test"
languages = [
  "en_us", "es_419", "fr_fr", "de_de", "it_it", "pt_br", "nl_nl", "pl_pl",
  "ru_ru", "uk_ua", "tr_tr", "ar_eg", "fa_ir", "hi_in", "bn_in", "ta_in",
  "te_in", "mr_in", "kn_in", "ml_in", "gu_in", "ur_pk", "sw_ke", "vi_vn",
  "id_id", "th_th", "ja_jp", "ko_kr", "cmn_hans_cn", "yo_ng",
]
files = ["data/{language}/audio/test.tar.gz"]
extra_files = ["data/{language}/test.tsv"]
max_bytes_per_file = 60_000_000
sample_languages = ["hi_in"]
sample_max_bytes_per_file = 20_000_000
order = 2

[sources.openslr26]
kind = "http"
licence = "Apache 2.0"
attribution = "Simulated room impulse responses, OpenSLR 26 (Apache 2.0)"
role = "reverb"
urls = ["https://www.openslr.org/resources/26/sim_rir_16k.zip"]
sample_urls = ["https://www.openslr.org/resources/26/sim_rir_16k.zip"]
order = 2

[sources.musan]
kind = "hf_files"
repo = "bilguun/musan-noise"
revision = "d179de7b0c6adf58bf295495b481386b8fdb97c1"
licence = "CC BY 4.0 (MUSAN corpus; selected Free Sound recordings are US public domain)"
attribution = "MUSAN, David Snyder, Guoguo Chen and Daniel Povey, OpenSLR 17"
role = "noise"
# Use direct Free Sound files. The source archive starts with music, some
# of which has different terms, and has no efficient noise-only byte range.
files = ["noise/free-sound/LICENSE", "noise/free-sound/noise-free-sound-00[0-9][0-9].wav"]
sample_files = ["noise/free-sound/LICENSE", "noise/free-sound/noise-free-sound-000[0-3].wav"]
max_total_bytes = 100_000_000
order = 2

[sources.emilia_yodas]
kind = "hf_tar_stream"
repo = "amphion/Emilia-Dataset"
licence = "CC BY 4.0 (Emilia-YODAS subset only)"
attribution = "Emilia-YODAS, Amphion (CC BY 4.0)"
role = "train-spontaneous"
# Only the Emilia-YODAS folder: the original Emilia subset is CC BY-NC.
languages = ["EN", "DE", "FR", "JA", "KO", "ZH"]
files = ["Emilia-YODAS/{language}/{language}-B000000.tar"]
max_bytes_per_file = 300_000_000
sample_languages = ["DE"]
sample_max_bytes_per_file = 20_000_000
order = 3

[sources.voxpopuli]
kind = "hf_rowgroups"
repo = "facebook/voxpopuli"
licence = "CC0 (data only; the project's code and models are CC BY-NC and are not used)"
attribution = "VoxPopuli, Meta (CC0)"
role = "train-spontaneous"
# Languages Emilia-YODAS does not cover. One row group (~0.5 GB) each, the
# smallest unit the files allow.
files = ["es/train-00000-of-*.parquet", "it/train-00000-of-*.parquet", "pl/train-00000-of-*.parquet"]
max_bytes_per_file = 1
sample_files = ["sl/train-00000-of-*.parquet"]
order = 3

[sources.common_voice]
kind = "hf_tar_stream"
repo = "fsicoli/common_voice_17_0"
licence = "CC0"
attribution = "Mozilla Common Voice 17.0 (CC0), from the fsicoli/common_voice_17_0 copy on Hugging Face"
role = "train-read"
# A copy of the official Common Voice 17.0 release. Unlike the official
# archives, the per-clip metadata (client_id = speaker, sentence, gender) is in
# separate TSV files, fetched whole (about 1-2 MB per language) before the
# audio archive is read from the start and stopped at the cap (~5 h of clips).
languages = [
  "hi", "bn", "ta", "te", "mr", "ml", "pa-IN", "ur", "or",
  "sw", "vi", "id", "th", "tr", "fa", "ja", "ko", "zh-CN",
  "it", "pl", "nl", "pt", "ru", "uk", "ar",
]
files = ["audio/{language}/train/{language}_train_0.tar"]
extra_files = ["transcript/{language}/train.tsv"]
max_bytes_per_file = 120_000_000
sample_languages = ["te"]
sample_max_bytes_per_file = 20_000_000
order = 4
