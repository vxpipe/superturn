  "hi", "bn", "ta", "te", "mr", "ml", "pa-IN", "ur", "or",
  "sw", "vi", "id", "th", "tr", "fa", "ja", "ko", "zh-CN",
  "it", "pl", "nl", "pt", "ru", "uk", "ar",
]
files = ["audio/{language}/train/{language}_train_0.tar"]
extra_files = ["transcript/{language}/train.tsv"]
max_bytes_per_file = 120_000_000
sample_languages = ["te"]
sample_max_bytes_per_file = 20_000_000
order = 4
