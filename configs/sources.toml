# Dataset sources for Superturn.
#
# The whole selection must fit `budget_gb`. A turn model of 100k-1M parameters
# needs a few hundred thousand labelled pauses with many voices, languages and
# conditions, not hundreds of hours per language. So instead of downloading
# whole archives, every source fetches only the bytes it uses:
#
#   wav_slices       a time window from each uncompressed WAV via HTTP range
#                    requests (the same window for all tracks of one meeting)
#   hf_rowgroups     selected row groups of Hugging Face parquet files; only
#                    those column chunks are downloaded
#   hf_tar_stream    read a Hugging Face tar archive from the start and stop at
#                    `max_bytes_per_file`, keeping the members already read;
#                    `extra_files` (metadata) are fetched whole
#   http_tar_stream  the same for a plain HTTPS archive
#   hf_files         named whole files in a pinned Hugging Face repository
#   http             small whole files
#
# `bin/plan-downloads` prices each source from provider listings and file
# metadata (parquet footers, HEAD requests) and refuses a plan over budget.
# role: train-conversation | train-read | train-spontaneous | test | noise | reverb | metadata
# `sample_*` keys select the small subset used by the on-machine smoke test.

budget_gb = 25

[sources.ami]
kind = "wav_slices"
list = "configs/url-lists/ami-headsets.tsv"
strip_prefix = "https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/"
licence = "CC BY 4.0"
attribution = "AMI Meeting Corpus, University of Edinburgh (CC BY 4.0)"
role = "train-conversation"
# 4 minutes from each of 171 meetings keeps every speaker while using a
# fraction of the 46.6 GB of headset audio. The window starts 30% into the
# meeting, past introductions.
minutes_per_meeting = 4.0
start_fraction = 0.3
sample_minutes_per_meeting = 1.0
sample_match = "/ES2002a/"
order = 1

[sources.ami_annotations]
kind = "http"
licence = "CC BY 4.0"
attribution = "AMI Meeting Corpus manual annotations v1.6.2, University of Edinburgh (CC BY 4.0)"
role = "metadata"
urls = ["https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip"]
order = 1

