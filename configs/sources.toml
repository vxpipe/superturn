licence = "CC0"
attribution = "Mozilla Common Voice 17.0 (CC0), from the fsicoli/common_voice_17_0 copy on Hugging Face"
role = "train-read"
# A copy of the official Common Voice 17.0 release. Unlike the official
# archives, the per-clip metadata (client_id = speaker, sentence, gender) is in
# separate TSV files, fetched whole (about 1-2 MB per language) before the
# audio archive is read from the start and stopped at the cap (~5 h of clips).
