[project]
name = "superturn"
version = "0.1.0"
description = "A small audio-only end-of-turn model for voice agents"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface_hub[hf_xet]>=0.30",
  "pyarrow>=26.0.1",
]

[project.scripts]
superturn = "superturn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "numpy>=2,<3"]
campaign = [
  "av>=14,<18",
  "numpy>=2,<3",
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "openai-whisper==20250625",
  "silero-vad==6.2.3",
  "torch==2.8.0",
  "webrtcvad-wheels==2.0.14.post1",
]
audit-model = [
  {include-group = "campaign"},
  "speechbrain==1.0.3",
  "torchaudio==2.8.0",
]
qwen-audio = [
  "transformers==5.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
