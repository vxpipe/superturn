[project]
name = "superturn"
version = "0.1.0"
description = "A small audio-only end-of-turn model for voice agents"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface_hub[hf_xet]>=0.30",
  "datacollective>=0.5",
  "pyarrow>=26.0.1",
]

[project.scripts]
superturn = "superturn.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
